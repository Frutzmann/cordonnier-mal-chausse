<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Health Dashboard — L'Atelier de l'Automatisation</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #011638;
    --purple: #9D4F9E;
    --purple-glow: rgba(157, 79, 158, 0.3);
    --light: #EEF0F2;
    --red: #E63946;
    --teal: #2EC4B6;
    --gold: #F4A261;
    --dark: #0a0e1a;
    --gray: #8892A4;
    --green: #2ECC71;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--dark);
    color: var(--light);
    min-height: 100vh;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(157,79,158,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(157,79,158,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 32px 60px;
  }

  /* ====== HEADER ====== */
  .header {
    text-align: center;
    margin-bottom: 48px;
    position: relative;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 400px;
    background: radial-gradient(circle, rgba(157,79,158,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .header-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--teal);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.8;
  }

  .header h1 {
    font-size: 36px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--light) 0%, rgba(238,240,242,0.7) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .header h1 span {
    background: linear-gradient(135deg, var(--purple) 0%, var(--teal) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-subtitle {
    font-size: 15px;
    color: rgba(238,240,242,0.4);
  }

  .header-timestamp {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(238,240,242,0.25);
    margin-top: 8px;
    letter-spacing: 1px;
  }

  /* ====== SUMMARY CARDS ====== */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 36px;
  }

  .summary-card {
    padding: 24px;
    border-radius: 14px;
    position: relative;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .summary-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }

  .summary-card.green {
    background: rgba(46,204,113,0.06);
    border: 1px solid rgba(46,204,113,0.2);
  }
  .summary-card.yellow {
    background: rgba(244,162,97,0.06);
    border: 1px solid rgba(244,162,97,0.2);
  }
  .summary-card.red {
    background: rgba(230,57,70,0.06);
    border: 1px solid rgba(230,57,70,0.2);
  }
  .summary-card.info {
    background: rgba(157,79,158,0.06);
    border: 1px solid rgba(157,79,158,0.2);
  }

  .summary-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .summary-card.green .summary-label { color: var(--green); }
  .summary-card.yellow .summary-label { color: var(--gold); }
  .summary-card.red .summary-label { color: var(--red); }
  .summary-card.info .summary-label { color: var(--purple); }

  .summary-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 42px;
    font-weight: 700;
    line-height: 1;
    transition: text-shadow 0.25s ease;
  }

  .summary-card:hover .summary-number {
    text-shadow: 0 0 20px currentColor;
  }

  .summary-card.green .summary-number { color: var(--green); }
  .summary-card.yellow .summary-number { color: var(--gold); }
  .summary-card.red .summary-number { color: var(--red); }
  .summary-card.info .summary-number { color: var(--purple); }

  .summary-unit {
    font-size: 14px;
    color: rgba(238,240,242,0.4);
    margin-top: 4px;
  }

  /* ====== TABLE ====== */
  .table-wrapper {
    background: rgba(255,255,255,0.015);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray);
    padding: 16px 16px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    white-space: nowrap;
  }

  thead th.right {
    text-align: right;
  }

  tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.03);
    cursor: pointer;
    transition: background 0.2s ease;
  }

  tbody tr:hover {
    background: rgba(157,79,158,0.04);
  }

  tbody tr:last-child {
    border-bottom: none;
  }

  tbody td {
    padding: 14px 16px;
    font-size: 14px;
    vertical-align: middle;
    white-space: nowrap;
  }

  tbody td.right {
    text-align: right;
  }

  .client-name {
    font-weight: 600;
    font-size: 14px;
  }

  .contact-name {
    font-size: 12px;
    color: rgba(238,240,242,0.4);
    margin-top: 2px;
  }

  /* Priority badges */
  .priority-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    display: inline-block;
  }

  .priority-haute {
    color: var(--red);
    background: rgba(230,57,70,0.12);
  }
  .priority-moyenne {
    color: var(--gold);
    background: rgba(244,162,97,0.12);
  }
  .priority-basse {
    color: var(--gray);
    background: rgba(255,255,255,0.06);
  }

  /* CA */
  .ca-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  /* Score */
  .score-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 16px;
  }

  .score-green { color: var(--green); }
  .score-yellow { color: var(--gold); }
  .score-red { color: var(--red); }

  /* Progress bar */
  .bar-cell {
    min-width: 140px;
  }

  .progress-bar-bg {
    width: 120px;
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s ease;
  }

  .fill-green { background: var(--green); }
  .fill-yellow { background: var(--gold); }
  .fill-red { background: var(--red); }

  /* Retard */
  .retard-none {
    color: rgba(238,240,242,0.2);
  }
  .retard-value {
    font-family: 'JetBrains Mono', monospace;
    color: var(--red);
    font-size: 13px;
  }

  /* Relances */
  .relances-none {
    color: rgba(238,240,242,0.2);
  }
  .relances-value {
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold);
    font-size: 13px;
  }

  /* Statut badge */
  .statut-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 600;
    display: inline-block;
  }

  .statut-sain {
    color: var(--green);
    background: rgba(46,204,113,0.12);
  }
  .statut-attention {
    color: var(--gold);
    background: rgba(244,162,97,0.12);
  }
  .statut-critique {
    color: var(--red);
    background: rgba(230,57,70,0.12);
  }

  /* ====== EXPAND ROW ====== */
  .detail-row {
    display: none;
  }

  .detail-row.open {
    display: table-row;
  }

  .detail-row td {
    padding: 0 16px 16px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }

  .detail-content {
    display: flex;
    gap: 32px;
    padding: 12px 20px;
    background: rgba(157,79,158,0.03);
    border-radius: 8px;
    border-left: 3px solid var(--purple);
  }

  .detail-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .detail-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gray);
  }

  .detail-value {
    font-size: 14px;
    color: var(--light);
  }

  /* ====== EXPAND INDICATOR ====== */
  .expand-icon {
    display: inline-block;
    font-size: 10px;
    color: rgba(238,240,242,0.3);
    margin-left: 8px;
    transition: transform 0.2s ease;
  }

  tr.expanded .expand-icon {
    transform: rotate(90deg);
    color: var(--purple);
  }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 900px) {
    .summary-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .container {
      padding: 24px 16px 40px;
    }
    .table-wrapper {
      overflow-x: auto;
    }
  }

  @media (max-width: 550px) {
    .summary-grid {
      grid-template-columns: 1fr;
    }
    .header h1 {
      font-size: 26px;
    }
  }
</style>
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="header-badge">Dashboard Operationnel</div>
    <h1>Client <span>Health</span> Dashboard</h1>
    <div class="header-subtitle">L'Atelier de l'Automatisation</div>
    <div class="header-timestamp" id="timestamp"></div>
  </div>

  <!-- SUMMARY CARDS -->
  <div class="summary-grid" id="summaryGrid"></div>

  <!-- TABLE -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Client</th>
          <th>Priorite</th>
          <th class="right">CA Annuel</th>
          <th class="right">Score</th>
          <th>Barre</th>
          <th class="right">Retard</th>
          <th class="right">Relances</th>
          <th>Statut</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<script>
  // ── Clients Data (Airtable snapshot) ──────────────────────────────
  const clients = [
    {
      nom: 'Dupont Fiduciaire',
      contact: 'Marie Dupont',
      email: 'marie@dupont-fiduciaire.lu',
      priorite: 'haute',
      caAnnuel: 48000,
      joursRetard: 0,
      relancesEnvoyees: 0,
      cycleFact: 'mensuel',
      conditionsPaiement: '30 jours',
    },
    {
      nom: 'Keysource Management',
      contact: 'Philippe Renard',
      email: 'p.renard@keysource.lu',
      priorite: 'haute',
      caAnnuel: 72000,
      joursRetard: 45,
      relancesEnvoyees: 3,
      cycleFact: 'mensuel',
      conditionsPaiement: '30 jours',
    },
    {
      nom: 'Patrimonia Family Office',
      contact: 'Isabelle Fontaine',
      email: 'i.fontaine@patrimonia.lu',
      priorite: 'moyenne',
      caAnnuel: 36000,
      joursRetard: 8,
      relancesEnvoyees: 1,
      cycleFact: 'trimestriel',
      conditionsPaiement: '45 jours',
    },
    {
      nom: 'BGL Advisory',
      contact: 'Thomas Weber',
      email: 't.weber@bgl-advisory.lu',
      priorite: 'haute',
      caAnnuel: 96000,
      joursRetard: 22,
      relancesEnvoyees: 2,
      cycleFact: 'mensuel',
      conditionsPaiement: '30 jours',
    },
    {
      nom: 'Nordea Fund Services',
      contact: 'Anna Lindqvist',
      email: 'a.lindqvist@nordea-fs.lu',
      priorite: 'moyenne',
      caAnnuel: 24000,
      joursRetard: 0,
      relancesEnvoyees: 0,
      cycleFact: 'trimestriel',
      conditionsPaiement: '60 jours',
    },
    {
      nom: 'Comptaflex',
      contact: 'Jean-Marc Hoffmann',
      email: 'jm.hoffmann@comptaflex.lu',
      priorite: 'basse',
      caAnnuel: 18000,
      joursRetard: '12',        // ← bug: string instead of number
      relancesEnvoyees: 1,
      cycleFact: 'mensuel',
      conditionsPaiement: '30 jours',
    },
    {
      nom: 'Ardian Luxembourg',
      contact: 'Sophie Muller',
      email: 's.muller@ardian.lu',
      priorite: 'haute',
      caAnnuel: 120000,
      joursRetard: 60,
      relancesEnvoyees: 5,
      cycleFact: 'mensuel',
      conditionsPaiement: '15 jours',
    },
  ];

  // ── Config ──────────────────────────────────────────────────────
  const POIDS = { retard: 40, relances: 30, priorite: 15, ca: 15 };
  const SEUILS = { retardGrave: 30, retardModere: 15, relancesMax: 5 };
  const SANTE = {
    bon:       { min: 75, label: 'SAIN' },
    attention: { min: 50, label: 'ATTENTION' },
    critique:  { min: 0,  label: 'CRITIQUE' },
  };

  // ── Scoring Engine (same as src/dashboard.js) ───────────────────
  function calculerScore(client) {
    let score = 100;

    if (client.joursRetard > SEUILS.retardGrave) {
      score -= POIDS.retard;
    } else if (client.joursRetard > SEUILS.retardModere) {
      score -= POIDS.retard * 0.6;
    } else if (client.joursRetard > 0) {
      score -= POIDS.retard * 0.3;
    }

    const ratioRelances = Math.min(client.relancesEnvoyees / SEUILS.relancesMax, 1);
    score -= POIDS.relances * ratioRelances;

    if (client.priorite === 'haute') {
      score += POIDS.priorite * 0.5;
    } else if (client.priorite === 'basse') {
      score -= POIDS.priorite * 0.3;
    }

    if (client.caAnnuel > 80000) {
      score += POIDS.ca;
    } else if (client.caAnnuel > 50000) {
      score += POIDS.ca * 0.5;
    }

    return Math.max(0, Math.min(100, Math.round(score)));
  }

  function getScoreClass(score) {
    if (score >= SANTE.bon.min) return 'green';
    if (score >= SANTE.attention.min) return 'yellow';
    return 'red';
  }

  function getStatutLabel(score) {
    if (score >= SANTE.bon.min) return SANTE.bon.label;
    if (score >= SANTE.attention.min) return SANTE.attention.label;
    return SANTE.critique.label;
  }

  // ── Build Dashboard ─────────────────────────────────────────────
  const resultats = clients.map(c => ({ ...c, score: calculerScore(c) }));
  resultats.sort((a, b) => a.score - b.score);

  // Counters
  let nbSain = 0, nbAttention = 0, nbCritique = 0;
  for (const r of resultats) {
    if (r.score >= SANTE.bon.min) nbSain++;
    else if (r.score >= SANTE.attention.min) nbAttention++;
    else nbCritique++;
  }

  // Retard moyen (preserves the string bug from Comptaflex)
  let totalRetard = 0;
  for (const c of clients) {
    totalRetard += c.joursRetard;
  }
  const retardMoyen = Math.round(totalRetard / clients.length);

  // Timestamp
  const now = new Date();
  document.getElementById('timestamp').textContent =
    'Genere le ' + now.toLocaleDateString('fr-FR', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });

  // ── Summary Cards ───────────────────────────────────────────────
  const summaryGrid = document.getElementById('summaryGrid');
  const cards = [
    { label: 'Sains', value: nbSain, cls: 'green', unit: 'clients' },
    { label: 'Attention', value: nbAttention, cls: 'yellow', unit: 'clients' },
    { label: 'Critiques', value: nbCritique, cls: 'red', unit: 'clients' },
    { label: 'Retard Moyen', value: retardMoyen.toLocaleString('fr-FR'), cls: 'info', unit: 'jours' },
  ];

  for (const card of cards) {
    const div = document.createElement('div');
    div.className = 'summary-card ' + card.cls;
    div.innerHTML =
      '<div class="summary-label">' + card.label + '</div>' +
      '<div class="summary-number">' + card.value + '</div>' +
      '<div class="summary-unit">' + card.unit + '</div>';
    summaryGrid.appendChild(div);
  }

  // ── Table Rows ──────────────────────────────────────────────────
  const tbody = document.getElementById('tableBody');

  for (const r of resultats) {
    const colorClass = getScoreClass(r.score);
    const statut = getStatutLabel(r.score);
    const prioClass = 'priority-' + r.priorite;

    const retardDisplay = (r.joursRetard === 0 || r.joursRetard === '0')
      ? '<span class="retard-none">&mdash;</span>'
      : '<span class="retard-value">' + r.joursRetard + 'j</span>';

    const relancesDisplay = r.relancesEnvoyees === 0
      ? '<span class="relances-none">&mdash;</span>'
      : '<span class="relances-value">' + r.relancesEnvoyees + '</span>';

    const caFormatted = (r.caAnnuel / 1000).toFixed(0) + 'k &euro;';

    // Main row
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td><div class="client-name">' + r.nom + ' <span class="expand-icon">&#9654;</span></div><div class="contact-name">' + r.contact + '</div></td>' +
      '<td><span class="priority-badge ' + prioClass + '">' + r.priorite + '</span></td>' +
      '<td class="right"><span class="ca-value">' + caFormatted + '</span></td>' +
      '<td class="right"><span class="score-value score-' + colorClass + '">' + r.score + '</span></td>' +
      '<td class="bar-cell"><div class="progress-bar-bg"><div class="progress-bar-fill fill-' + colorClass + '" style="width:' + r.score + '%"></div></div></td>' +
      '<td class="right">' + retardDisplay + '</td>' +
      '<td class="right">' + relancesDisplay + '</td>' +
      '<td><span class="statut-badge statut-' + (colorClass === 'green' ? 'sain' : colorClass === 'yellow' ? 'attention' : 'critique') + '">' + statut + '</span></td>';

    // Detail row
    const detailTr = document.createElement('tr');
    detailTr.className = 'detail-row';
    detailTr.innerHTML =
      '<td colspan="8"><div class="detail-content">' +
        '<div class="detail-item"><span class="detail-label">Email</span><span class="detail-value">' + r.email + '</span></div>' +
        '<div class="detail-item"><span class="detail-label">Cycle facturation</span><span class="detail-value">' + r.cycleFact + '</span></div>' +
        '<div class="detail-item"><span class="detail-label">Conditions paiement</span><span class="detail-value">' + r.conditionsPaiement + '</span></div>' +
        '<div class="detail-item"><span class="detail-label">CA Annuel</span><span class="detail-value">' + r.caAnnuel.toLocaleString('fr-FR') + ' &euro;</span></div>' +
      '</div></td>';

    tr.addEventListener('click', () => {
      const isOpen = detailTr.classList.contains('open');
      // Close all
      document.querySelectorAll('.detail-row.open').forEach(el => el.classList.remove('open'));
      document.querySelectorAll('tr.expanded').forEach(el => el.classList.remove('expanded'));
      if (!isOpen) {
        detailTr.classList.add('open');
        tr.classList.add('expanded');
      }
    });

    tbody.appendChild(tr);
    tbody.appendChild(detailTr);
  }
</script>

</body>
</html>
